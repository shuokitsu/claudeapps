<!DOCTYPE html>
<html lang="ja">
<meta name="robots" content="noindex, nofollow">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロジックカラー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(135deg, #fef2f2 0%, #fef3c7 100%);
        }

        .toy-shadow {
            box-shadow: 0 8px 0 #cbd5e1, 0 15px 20px rgba(0, 0, 0, 0.1);
        }

        .toy-button-shadow {
            box-shadow: 0 5px 0 rgba(0, 0, 0, 0.15);
        }

        .toy-button-shadow:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
        }

        .hint-box {
            background-color: #1e293b;
            border-radius: 0.5rem;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .block-pop {
            animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
            }

            100% {
                transform: scale(1);
            }
        }

        .confetti {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 text-slate-800">

    <header

    <script>
        const COLORS = {
            yellow: { id: 'yellow', bg: 'bg-amber-400', border: 'border-amber-500', chipBg: 'bg-amber-400' },
            purple: { id: 'purple', bg: 'bg-purple-600', border: 'border-purple-700', chipBg: 'bg-purple-600' },
            green: { id: 'green', bg: 'bg-emerald-600', border: 'border-emerald-700', chipBg: 'bg-emerald-600' },
            red: { id: 'red', bg: 'bg-rose-500', border: 'border-rose-600', chipBg: 'bg-rose-500' },
            empty: { id: 'empty', bg: 'bg-slate-700', border: 'border-slate-800', chipBg: 'bg-transparent' }
        };

        const PALETTE_COLORS = ['yellow', 'purple', 'green', 'red'];

        let soundEnabled = true;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'select') {
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'place') {
                    osc.frequency.setValueAtTime(523.25, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                } else if (type === 'clear') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const o = audioCtx.createOscillator();
                        const g = audioCtx.createGain();
                        o.connect(g);
                        g.connect(audioCtx.destination);
                        o.frequency.setValueAtTime(freq, now + idx * 0.1);
                        g.gain.setValueAtTime(0.2, now + idx * 0.1);
                        g.gain.linearRampToValueAtTime(0, now + idx * 0.1 + 0.25);
                        o.start(now + idx * 0.1);
                        o.stop(now + idx * 0.1 + 0.25);
                    });
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }
            } catch (e) { }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').className = soundEnabled ? 'fas fa-volume-up' : 'fas fa-volume-mute';
        }

        let currentStageIndex = 0;
        let solutionGrid = [];
        let userGrid = [];
        let rowHints = [];
        let colHints = [];
        let selectedColor = 'yellow';

        const FIXED_STAGES = [
            // Stage 1
            [
                ['yellow', 'purple', 'yellow', 'red'],
                ['green', 'purple', 'yellow', 'red'],
                ['green', 'purple', 'yellow', 'red'],
                ['green', 'purple', 'green', 'red']
            ],

            // Stage 2
            [
                ['yellow', 'yellow', 'yellow', 'purple'],
                ['green', 'green', 'yellow', 'green'],
                ['red', 'green', 'yellow', 'purple'],
                ['purple', 'red', 'yellow', 'purple']
            ],

            // Stage 3
            [
                ['purple', 'purple', 'purple', 'red'],
                ['yellow', 'yellow', 'purple', 'red'],
                ['green', 'green', 'purple', 'purple'],
                ['green', 'purple', 'yellow', 'yellow']
            ],

            // Stage 4
            [
                ['yellow', 'yellow', 'yellow', 'purple'],
                ['yellow', 'green', 'yellow', 'purple'],
                ['yellow', 'yellow', 'yellow', 'purple'],
                ['yellow', 'yellow', 'yellow', 'yellow']
            ],

            // Stage 5
            [
                ['green', 'red', 'red', 'red'],
                ['yellow', 'purple', 'red', 'red'],
                ['green', 'red', 'red', 'yellow'],
                ['red', 'red', 'red', 'red']
            ],

            // Stage 6
            [
                ['purple', 'green', 'red', 'green'],
                ['yellow', 'green', 'green', 'green'],
                ['green', 'green', 'green', 'green'],
                ['purple', 'yellow', 'purple', 'red']
            ],

            // Stage 7
            [
                ['purple', 'purple', 'green', 'purple'],
                ['purple', 'purple', 'yellow', 'purple'],
                ['red', 'yellow', 'red', 'purple'],
                ['red', 'green', 'green', 'purple']
            ],

            // Stage 8
            [
                ['yellow', 'red', 'green', 'green'],
                ['purple', 'red', 'purple', 'purple'],
                ['yellow', 'yellow', 'purple', 'red'],
                ['yellow', 'yellow', 'green', 'green']
            ],

            // Stage 9
            [
                ['yellow', 'yellow', 'red', 'red'],
                ['yellow', 'red', 'purple', 'red'],
                ['purple', 'green', 'green', 'purple'],
                ['purple', 'red', 'purple', 'red']
            ],

            // Stage 10
            [
                ['red', 'yellow', 'red', 'red'],
                ['purple', 'purple', 'yellow', 'yellow'],
                ['green', 'green', 'red', 'purple'],
                ['red', 'green', 'yellow', 'purple']
            ],

            // Stage 11
            [
                ['yellow', 'yellow', 'red', 'purple'],
                ['red', 'purple', 'green', 'green'],
                ['yellow', 'purple', 'green', 'green'],
                ['red', 'green', 'green', 'red']
            ],

            // Stage 12
            [
                ['yellow', 'green', 'yellow', 'yellow'],
                ['green', 'purple', 'purple', 'red'],
                ['purple', 'purple', 'yellow', 'green'],
                ['green', 'purple', 'purple', 'green']
            ],

            // Stage 13
            [
                ['green', 'green', 'green', 'green'],
                ['purple', 'purple', 'purple', 'purple'],
                ['green', 'purple', 'red', 'purple'],
                ['purple', 'purple', 'purple', 'yellow']

            // Stage 14
            [

            // Stage 15

            // Stage 18

            // Stage 19

            // Stage 20

            // Stage 21
            [
                ['green', 'purple', 'purple', 'purple'],

                ['purple', 'red', 'purple', 'yellow'],
                ['green', 'red', 'red', 'purple']
            ],

            // Stage 22
            [
                ['yellow', 'green', 'green', 'green'],
                ['green', 'purple', 'purple', 'red'],
                ['yellow', 'purple', 'purple', 'yellow'],
                ['green', 'purple', 'green', 'green']
            ],

            // Stage 23
            [
                ['purple', 'purple', 'yellow', 'purple'],
                ['green', 'green', 'red', 'yellow'],
                ['red', 'purple', 'red', 'red'],
                ['green', 'red', 'red', 'green']
            ],

            // Stage 24
            [
                ['yellow', 'yellow', 'purple', 'yellow'],
                ['yellow', 'red', 'red', 'green'],
                ['green', 'red', 'red', 'red'],
                ['purple', 'yellow', 'red', 'green']
            ],

            // Stage 25
            [
                ['yellow', 'yellow', 'red', 'red'],
                ['red', 'red', 'red', 'red'],
                ['yellow', 'purple', 'green', 'purple'],
                ['green', 'red', 'green', 'green']
            ],

            // Stage 26
            [
                ['red', 'purple', 'green', 'purple'],
                ['purple', 'purple', 'yellow', 'purple'],
                ['purple', 'purple', 'yellow', 'purple'],
                ['red', 'yellow', 'red', 'yellow']
            ],

            // Stage 27
            [
                ['yellow', 'purple', 'yellow', 'red'],
                ['purple', 'purple', 'red', 'red'],
                ['purple', 'green', 'green', 'red'],
                ['yellow', 'green', 'purple', 'yellow']
            ],

            // Stage 28
            [
                ['yellow', 'purple', 'green', 'yellow'],
                ['green', 'red', 'red', 'purple'],
                ['yellow', 'red', 'green', 'red'],
                ['yellow', 'yellow', 'yellow', 'yellow']
            ],

            // Stage 29
            [
                ['purple', 'red', 'red', 'green'],
                ['yellow', 'yellow', 'green', 'yellow'],
                ['red', 'yellow', 'yellow', 'yellow'],
                ['purple', 'green', 'green', 'purple']
            ],

            // Stage 30
            [
                ['red', 'red', 'red', 'purple'],
                ['green', 'red', 'purple', 'green'],
                ['red', 'yellow', 'red', 'red'],
                ['green', 'yellow', 'yellow', 'purple']
            ],

            // Stage 31
            [
                ['red', 'green', 'green', 'purple'],
                ['yellow', 'red', 'yellow', 'red'],
                ['purple', 'yellow', 'green', 'purple'],
                ['red', 'yellow', 'red', 'green']
            ],

            // Stage 32
            [
                ['red', 'red', 'yellow', 'red'],
                ['green', 'green', 'red', 'purple'],
                ['red', 'green', 'red', 'purple'],
                ['yellow', 'red', 'yellow', 'green']
            ]
        ];

        window.onload = function () {
            startRandomStage();
        };

        function preparePuzzle(stageIdx) {
            if (stageIdx < FIXED_STAGES.length) {
                solutionGrid = JSON.parse(JSON.stringify(FIXED_STAGES[stageIdx]));
            } else {
                solutionGrid = Array(4).fill(null).map(() => Array(4).fill(null));
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const randomColor = PALETTE_COLORS[Math.floor(Math.random() * PALETTE_COLORS.length)];
                        solutionGrid[r][c] = randomColor;
                    }
                }
            }

            rowHints = [[], [], [], []];
            colHints = [[], [], [], []];

            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const color = solutionGrid[r][c];
                    rowHints[r].push(color);
                    colHints[c].push(color);
                }
            }

            const colorOrder = { yellow: 0, purple: 1, green: 2, red: 3 };
            for (let i = 0; i < 4; i++) {
                rowHints[i].sort((a, b) => colorOrder[a] - colorOrder[b]);
                colHints[i].sort((a, b) => colorOrder[a] - colorOrder[b]);
            }

            userGrid = Array(4).fill(null).map(() => Array(4).fill('empty'));
        }

        function loadStage(index) {
            currentStageIndex = index;
            preparePuzzle(index);

            const title = index < FIXED_STAGES.length ? `ステージ ${index + 1}` : `ランダムステージ ${index + 1 - FIXED_STAGES.length}`;
            document.getElementById('stageTitle').innerText = title;
            selectedColor = PALETTE_COLORS[0];

            renderHints();
            renderGrid();
            renderPalette();
        }

        function renderHints() {
            const chipClass = "w-[6px] h-[6px] sm:w-2 sm:h-2 rounded-[1px] shadow-sm shrink-0";

            for (let c = 0; c < 4; c++) {
                const el = document.getElementById(`colHint-${c}`);
                el.innerHTML = '';
                colHints[c].forEach(colorKey => {
                    const chip = document.createElement('div');
                    chip.className = `${chipClass} ${COLORS[colorKey].chipBg}`;
                    el.appendChild(chip);
                });
            }

            for (let r = 0; r < 4; r++) {
                const el = document.getElementById(`rowHint-${r}`);
                el.innerHTML = '';
                rowHints[r].forEach(colorKey => {
                    const chip = document.createElement('div');
                    chip.className = `${chipClass} ${COLORS[colorKey].chipBg}`;
                    el.appendChild(chip);
                });
            }
        }

        function renderGrid() {
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    const cellVal = userGrid[r][c];
                    const colorObj = COLORS[cellVal];
                    const btn = document.getElementById(`cell-${r}-${c}`);

                    btn.className = `w-12 h-12 sm:w-16 sm:h-16 rounded-xl sm:rounded-2xl ${colorObj.bg} ${colorObj.border} border-b-4 toy-button-shadow transition active:scale-95 flex items-center justify-center text-xl sm:text-2xl font-black block-pop`;

                    if (cellVal !== 'empty') {
                        btn.innerHTML = `<div class="w-full h-full rounded-xl sm:rounded-2xl bg-white/25 blur-[2px] m-1 scale-75"></div>`;
                    } else {
                        btn.innerHTML = '';
                    }
                }
            }
        }

        function renderPalette() {
            const container = document.getElementById('paletteContainer');
            container.innerHTML = '';

            PALETTE_COLORS.forEach(colorKey => {
                const colorObj = COLORS[colorKey];
                const isSelected = selectedColor === colorKey;

                const btn = document.createElement('button');
                btn.className = `w-10 h-10 sm:w-12 sm:h-12 rounded-xl ${colorObj.bg} ${colorObj.border} border-b-4 flex items-center justify-center text-2xl toy-button-shadow transition transform ${isSelected ? 'ring-4 ring-rose-500 scale-110 -translate-y-1' : 'opacity-85 hover:opacity-100'}`;
                btn.innerHTML = `<div class="w-full h-full rounded-xl bg-white/25 blur-[1px] m-1 scale-75 pointer-events-none"></div>`;

                btn.onclick = () => {
                    selectedColor = colorKey;
                    playSound('select');
                    renderPalette();
                };

                container.appendChild(btn);
            });

            const isEraserSelected = selectedColor === 'empty';
            const eraserBtn = document.createElement('button');
            eraserBtn.className = `w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-white border-slate-300 border-b-4 flex items-center justify-center text-lg text-slate-600 toy-button-shadow transition transform ${isEraserSelected ? 'ring-4 ring-rose-500 scale-110 -translate-y-1' : 'opacity-85 hover:opacity-100'}`;
            eraserBtn.innerHTML = `<i class="fas fa-eraser pointer-events-none"></i>`;
            eraserBtn.title = '消す';
            eraserBtn.onclick = () => {
                selectedColor = 'empty';
                playSound('select');
                renderPalette();
            };
            container.appendChild(eraserBtn);
        }

        function onCellClick(r, c) {
            if (userGrid[r][c] === selectedColor) {
                userGrid[r][c] = 'empty';
                playSound('select');
            } else {
                userGrid[r][c] = selectedColor;
                playSound('place');
            }
            renderGrid();
        }

        function resetBoard() {
            userGrid = Array(4).fill(null).map(() => Array(4).fill('empty'));
            playSound('select');
            renderGrid();
        }

        function checkAnswer() {
            let isFull = true;
            for (let r = 0; r < 4; r++) {
                for (let c = 0; c < 4; c++) {
                    if (userGrid[r][c] === 'empty') isFull = false;
                }
            }

            if (!isFull) {
                playSound('error');
                showToast('すべてのマスに色をおいてね！');
                return;
            }

            let isCorrect = true;
            const colorOrder = { yellow: 0, purple: 1, green: 2, red: 3 };

            for (let r = 0; r < 4; r++) {
                const userRow = [userGrid[r][0], userGrid[r][1], userGrid[r][2], userGrid[r][3]].sort((a, b) => colorOrder[a] - colorOrder[b]);
                if (JSON.stringify(userRow) !== JSON.stringify(rowHints[r])) {
                    isCorrect = false;
                    break;
                }
            }

            if (isCorrect) {
                for (let c = 0; c < 4; c++) {
                    const userCol = [userGrid[0][c], userGrid[1][c], userGrid[2][c], userGrid[3][c]].sort((a, b) => colorOrder[a] - colorOrder[b]);
                    if (JSON.stringify(userCol) !== JSON.stringify(colHints[c])) {
                        isCorrect = false;
                        break;
                    }
                }
            }

            if (isCorrect) {
                playSound('clear');
                spawnConfetti();
                document.getElementById('clearModal').classList.remove('hidden');
                document.getElementById('clearModal').classList.add('flex');
            } else {
                playSound('error');
                showToast('おしい！上と左のヒントと見比べてみよう！');
            }
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white font-bold text-sm px-6 py-3 rounded-full shadow-lg z-50 animate-bounce whitespace-nowrap';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function prevStage() {
            if (currentStageIndex > 0) {
                playSound('select');
                loadStage(currentStageIndex - 1);
            }
        }

        function nextStage() {
            playSound('select');
            loadStage(currentStageIndex + 1);
        }

        function openStageSelect() {
            playSound('select');
            const grid = document.getElementById('stageGrid');
            grid.innerHTML = '';

            for (let idx = 0; idx < FIXED_STAGES.length; idx++) {
                const btn = document.createElement('button');
                const isCurrent = idx === currentStageIndex;
                btn.className = `h-12 rounded-2xl font-black text-sm flex items-center justify-center border-b-4 toy-button-shadow transition ${isCurrent ? 'bg-rose-600 text-white border-rose-800' : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border-slate-300'}`;
                btn.innerText = idx + 1;
                btn.onclick = () => {
                    closeStageModal();
                    loadStage(idx);
                };
                grid.appendChild(btn);
            }

            document.getElementById('stageModal').classList.remove('hidden');
            document.getElementById('stageModal').classList.add('flex');
        }

        function closeStageModal() {
            document.getElementById('stageModal').classList.add('hidden');
            document.getElementById('stageModal').classList.remove('flex');
        }

        function closeClearModal() {
            document.getElementById('clearModal').classList.add('hidden');
            document.getElementById('clearModal').classList.remove('flex');
            resetBoard();
        }

        function nextStageFromModal() {
            closeClearModal();
            loadStage(currentStageIndex + 1);
        }

        function startRandomStage() {
            closeStageModal();
            playSound('select');
            loadStage(FIXED_STAGES.length + Math.floor(Math.random() * 100));
        }

        function spawnConfetti() {
            const confettiCount = 50;
            const colors = ['#f59e0b', '#9333ea', '#059669', '#f43f5e'];

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-10px';
                confetti.style.width = (Math.random() * 8 + 6) + 'px';
                confetti.style.height = (Math.random() * 8 + 6) + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

                document.body.appendChild(confetti);

                const duration = Math.random() * 2 + 1.5;
                const xOffset = (Math.random() - 0.5) * 200;

                confetti.animate([
                    { transform: `translate(0, 0) rotate(0deg)`, opacity: 1 },
                    { transform: `translate(${xOffset}px, ${window.innerHeight}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }
                ], {
                    duration: duration * 1000,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)'
                }).onfinish = () => confetti.remove();
            }
        }
    </script>
</body>
